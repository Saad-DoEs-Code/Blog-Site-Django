{% load static %}

<li>
  <article class="post-card">
    <div class="post-card-header">
      <a href="{% url 'post-details' post.slug %}" class="post-image-link">
        <img src="{% static 'blog/images/'|add:post.image_name %}" alt="{{ post.title }}" class="post-image" />
      </a>
      {% if post.tags.all %}
      <div class="post-card-tags">
        {% for tag in post.tags.all %}
          <span class="tag-badge">{{ tag.caption }}</span>
        {% endfor %}
      </div>
      {% endif %}
    </div>

    <div class="post-card-body">
      <div class="post-meta">
        <time datetime="{{ post.date|date:'Y-m-d' }}">{{ post.date|date:"M d, Y" }}</time>
        {% if post.author %}
        <span class="meta-separator">&bull;</span>
        <a href="mailto:{{ post.author.email_address }}" class="author-mailto-link">
          By {{ post.author.full_name }}
        </a>
        {% endif %}
      </div>

      <h3 class="post-card-title">
        <a href="{% url 'post-details' post.slug %}">{{ post.title }}</a>
      </h3>

      <p class="post-card-excerpt">{{ post.excerpt }}</p>

      <a href="{% url 'post-details' post.slug %}" class="post-read-more">
        Read Article &rarr;
      </a>
    </div>
  </article>
</li>
